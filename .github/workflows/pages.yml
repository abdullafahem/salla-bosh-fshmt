# Free hosting: every time you upload a new PDF to the pdf/ folder (or press
# "Run workflow"), GitHub converts it and publishes the site on GitHub Pages.
name: Convert PDF and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pdfplumber
      - name: Convert the newest PDF
        run: |
          PDF=$(ls -t pdf/*.pdf | head -1)
          python pdf_to_json.py "$PDF" --report
          mkdir -p site
          cp static/index.html site/
          cp data/timetable.json site/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
